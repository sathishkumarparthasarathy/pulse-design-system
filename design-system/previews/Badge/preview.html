<!-- @dsCard group="Data display" height=330 subtitle="4 variants × 10 tones × 3 sizes · dot and icon slots" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Badge</title></head>
<body>
<div id="root"></div>
<script>
(function () {
  var e = React.createElement;
  var P = window.PULSE;
  var Badge = P.Badge, Check = P.Check, Stars01 = P.Stars01;

  function Label(props) {
    return e('div', { className: 'text-xs font-semibold uppercase tracking-wide text-gray-500 mb-2.5' }, props.children);
  }

  var tones = ['gray', 'brand', 'error', 'warning', 'success', 'blue', 'indigo', 'purple', 'pink', 'ai'];

  function Demo() {
    return e('div', { className: 'flex flex-col gap-5 p-6' },
      e('div', null,
        e(Label, null, 'pill-color — the default'),
        e('div', { className: 'flex flex-wrap gap-2' },
          tones.map(function (t) { return e(Badge, { key: t, tone: t }, t); })
        )
      ),
      e('div', null,
        e(Label, null, 'pill-outline'),
        e('div', { className: 'flex flex-wrap gap-2' },
          tones.map(function (t) { return e(Badge, { key: t, variant: 'pill-outline', tone: t }, t); })
        )
      ),
      e('div', null,
        e(Label, null, 'badge-color · badge-modern · slots · sizes'),
        e('div', { className: 'flex flex-wrap items-center gap-2' },
          e(Badge, { variant: 'badge-color', tone: 'brand' }, 'Squared'),
          e(Badge, { variant: 'badge-modern', dot: true, tone: 'success' }, 'Modern + dot'),
          e(Badge, { tone: 'success', dot: true }, 'Live'),
          e(Badge, { tone: 'ai', leadingIcon: e(Stars01, null) }, 'AI scored'),
          e(Badge, { tone: 'brand', trailingIcon: e(Check, null) }, 'Verified'),
          e(Badge, { size: 'sm', tone: 'gray' }, 'sm'),
          e(Badge, { size: 'md', tone: 'gray' }, 'md'),
          e(Badge, { size: 'lg', tone: 'gray' }, 'lg')
        )
      )
    );
  }

  var root = document.getElementById('root');
  if (ReactDOM.createRoot) ReactDOM.createRoot(root).render(e(Demo));
  else ReactDOM.render(e(Demo), root);
})();
</script>
</body>
</html>
